<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>忍者アクション - 5ステージ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="ui-top">
            <div class="hp-display">
                HP: <span id="hearts"></span>
            </div>
            <div class="stage-display">
                Stage: <span id="stage">1</span>
            </div>
            <div class="score-display">
                Score: <span id="score">0000</span>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="controls">
            <div class="controls-left">
                <button class="control-btn move-btn" id="leftBtn">←</button>
                <button class="control-btn move-btn" id="rightBtn">→</button>
            </div>
            <div class="controls-right">
                <button class="control-btn action-btn" id="jumpBtn">Jump</button>
                <button class="control-btn action-btn" id="attackBtn">⚔</button>
            </div>
        </div>

        <div class="game-over" id="gameOver">
            <h2 id="gameOverMessage">Game Over</h2>
            <p>最終スコア: <span id="finalScore">0</span></p>
            <p>到達ステージ: <span id="finalStage">1</span></p>
            <button class="restart-btn" onclick="restartGame()">もう一度遊ぶ</button>
        </div>

        <div class="stage-clear" id="stageClear">
            <h2>ステージクリア！</h2>
            <p>スコア: <span id="stageScore">0</span></p>
            <button class="next-btn" onclick="nextStage()">次のステージへ</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
